<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque - POO</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="conteiner">
        <h1>Cadastro de produtos</h1>

        <form id="produto-form">
            <div class="form-group">
                <label for="nome">Nome do produto:</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Ex. notebook"
                    required
                >
            </div>

            <div class="form-group">
                <label for="preco">Preço (R$):</label>
                <input
                    type="number"
                    id="preco"
                    min="0.01"
                    step="0.01"
                    placeholder="Ex. 13.40"
                    required
                >
            </div>

            <div class="form-group">
                <label for="quantidade">Quantidade:</label>
                <input
                    type="number"
                    id="quantidade"
                    min="1"
                    step="1"
                    placeholder="Ex. 5"
                    required
                >
            </div>

            <button type="submit" class="btn-primary">
                Adicionar produto
            </button>
        </form>

        <div class="resumo-conteiner">
            <h3 id="total-estoque">Total em estoque: R$ 0,00</h3>

            <button
                type="button"
                id="limpar-tabela"
                class="btn-danger"
            >
                Limpar tudo
            </button>
        </div>

        <div class="form-group busca-grupo">
            <label for="campo-busca">Pesquisar produto:</label>

            <input
                type="text"
                id="campo-busca"
                placeholder="Digite o nome do produto..."
                autocomplete="off"
            >

            <p
                id="mensagem-busca"
                class="mensagem-busca"
                aria-live="polite"
            ></p>
        </div>

        <table id="tabela-produtos">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço-Un</th>
                    <th>Quant.</th>
                    <th>Sub-total</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody></tbody>
            <tfoot></tfoot>
        </table>
    </div>
</body>
</html>
